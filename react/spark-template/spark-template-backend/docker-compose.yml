services:
  mysql:
    image: mysql:8.4
    container_name: spark-template-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: fairy_vip_notes
      MYSQL_USER: fairy-vip
      MYSQL_PASSWORD: fairy-vip
      MYSQL_ROOT_PASSWORD: fairy-vip-root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - spark-template-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  spark-template-mysql-data:
